{{define "content"}}
<div class="login-card">
  <span class="brand-mark brand-mark-lg" aria-hidden="true">{{initials .Biz.BusinessName}}</span>
  <h1>Sign in</h1>
  <p class="sub">Welcome to {{.Biz.BusinessName}}. Use your staff account to continue.</p>
  <form method="post" action="/login" novalidate>
    {{template "csrf" .}}
    <input type="hidden" name="next" value="{{.D.next}}">
    <div class="field">
      <label for="f-username">Username</label>
      <input id="f-username" name="username" value="{{.D.username}}" autocomplete="username" required autofocus autocapitalize="none" spellcheck="false">
    </div>
    <div class="field">
      <label for="f-password">Password</label>
      <input id="f-password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-block" type="submit">Sign in</button>
  </form>
  <p class="login-note">{{template "icon" "shield"}}Forgot your password? Ask an administrator to reset it.</p>
</div>
{{end}}
