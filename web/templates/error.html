{{define "content"}}
<div class="error-page">
  <span class="error-icon" aria-hidden="true">{{template "icon" "alert"}}</span>
  <p class="error-code">{{.D.code}}</p>
  <h1>{{if eq .D.code 404}}Page not found{{else if eq .D.code 403}}Access denied{{else if eq .D.code 400}}Action not allowed{{else}}Something went wrong{{end}}</h1>
  <p class="muted">{{.D.message}}</p>
  <p class="actions"><a class="btn" href="/">Go to the start page</a>{{if not .Session}} <a class="btn btn-secondary" href="/login">Sign in</a>{{end}}</p>
</div>
{{end}}
